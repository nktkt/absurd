name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (default features)
        run: cargo build --workspace --all-targets
      - name: Unit tests (no Postgres required)
        run: cargo test --workspace --lib --tests
      - name: Build with rustls
        run: cargo build -p absurd-sdk --features rustls
      - name: Build with native-tls
        run: cargo build -p absurd-sdk --no-default-features --features native-tls
      - name: Build without default features
        run: cargo build -p absurd-sdk --no-default-features

  integration:
    name: integration (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: absurd
          POSTGRES_PASSWORD: absurd
          POSTGRES_DB: absurd_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U absurd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ABSURD_DATABASE_URL: "postgresql://absurd:absurd@127.0.0.1:5432/absurd_ci"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Init schema
        run: cargo run -p absurdctl -- init
      - name: Create default queue
        run: cargo run -p absurdctl -- create-queue default
      - name: Run end-to-end example
        run: cargo run -p absurd-sdk --example order_fulfillment
      - name: Run typed example
        run: cargo run -p absurd-sdk --example typed_task
      - name: Validate cleanup CLI
        run: cargo run -p absurdctl -- cleanup --queue default
      - name: Validate queue-policy CLI
        run: cargo run -p absurdctl -- queue-policy default
